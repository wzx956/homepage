<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>我的主页</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#4285f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Noto Sans SC",sans-serif}main{width:min(760px,100%);margin:auto;padding:7vh 18px 40px}.top{display:flex;justify-content:flex-end;gap:10px;margin-bottom:7vh}button,.filelabel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer}h1{text-align:center;font-size:clamp(30px,8vw,46px);font-weight:600;margin:0 0 26px}.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px}.search input{border:0;outline:0;min-width:0;flex:1;background:transparent;font:inherit;padding:10px 12px}.search button,.primary{background:var(--accent);color:white;border:0}.sectionhead{display:flex;justify-content:space-between;margin:34px 2px 14px}.sectionhead h2{font-size:15px;margin:0}.muted,footer{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.site{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 5px 12px;border:1px solid var(--line);background:var(--card);border-radius:16px;color:inherit;text-decoration:none;min-width:0}.favicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eef2f8;overflow:hidden}.favicon img{width:24px;height:24px}.sitename{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.remove{position:absolute;top:3px;right:5px;border:0;background:transparent;color:var(--muted);padding:1px 5px}.empty{grid-column:1/-1;color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}footer{text-align:center;margin-top:38px}dialog{border:1px solid var(--line);border-radius:18px;width:min(420px,calc(100% - 30px));padding:20px;background:white}dialog input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0 13px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end}@media(max-width:380px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top{margin-bottom:35px}}
</style></head><body><main><div class="top"><button id="addBtn">＋ 添加</button><button id="importBtn">导入书签</button><input id="fileInput" type="file" accept=".html,.htm,text/html" hidden></div><h1>我的主页</h1><form class="search" id="searchForm"><input id="query" type="search" placeholder="搜索网页或输入网址" aria-label="搜索网页或输入网址"><button>搜索</button></form><div class="sectionhead"><h2>快捷方式</h2><span class="muted" id="count"></span></div><div class="grid" id="grid"></div><footer>快捷方式保存在当前浏览器中 · 可随时导入 Chrome 书签</footer></main><dialog id="dlg"><h3>添加快捷方式</h3><label>名称<input id="siteName" placeholder="例如：GitHub"></label><label>网址<input id="siteUrl" placeholder="https://github.com"></label><div class="actions"><button id="cancel">取消</button><button class="primary" id="save">保存</button></div></dialog><script>
const KEY='simpleChromeHomepageSitesV1',defaults=[['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],['GitHub','https://github.com'],['Reddit','https://www.reddit.com'],['ChatGPT','https://chatgpt.com'],['翻译','https://translate.google.com'],['Gmail','https://mail.google.com'],['地图','https://maps.google.com']].map(([name,url])=>({name,url}));let sites;try{sites=JSON.parse(localStorage.getItem(KEY)||'null');if(!Array.isArray(sites))sites=defaults}catch(e){sites=defaults}const grid=document.querySelector('#grid'),count=document.querySelector('#count');function persist(){try{localStorage.setItem(KEY,JSON.stringify(sites))}catch(e){alert('浏览器存储不可用，请检查隐私设置。')}}function render(){grid.replaceChildren();count.textContent=sites.length+' 个';if(!sites.length){let d=document.createElement('div');d.className='empty';d.textContent='还没有快捷方式，请点击添加或导入书签。';grid.append(d);return}sites.forEach((s,i)=>{let a=document.createElement('a');a.className='site';a.href=s.url;a.title=s.url;let f=document.createElement('div');f.className='favicon';let img=document.createElement('img');img.alt='';img.loading='lazy';img.src='https://www.google.com/s2/favicons?domain_url='+encodeURIComponent(s.url)+'&sz=64';img.onerror=()=>{img.remove();f.textContent=(s.name||'?').slice(0,1)};f.append(img);let n=document.createElement('span');n.className='sitename';n.textContent=s.name;let rm=document.createElement('button');rm.className='remove';rm.type='button';rm.textContent='×';rm.setAttribute('aria-label','删除'+s.name);rm.onclick=e=>{e.preventDefault();e.stopPropagation();sites.splice(i,1);persist();render()};a.append(f,n,rm);grid.append(a)})}document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();let q=document.querySelector('#query').value.trim();if(!q)return;location.href=/^(https?:\/\/|([\w-]+\.)+[\w-]{2,}(\/.*)?$)/i.test(q)?(/^[a-z]+:\/\//i.test(q)?q:'https://'+q):'https://www.google.com/search?q='+encodeURIComponent(q)};const dlg=document.querySelector('#dlg');document.querySelector('#addBtn').onclick=()=>dlg.showModal();document.querySelector('#cancel').onclick=()=>dlg.close();document.querySelector('#save').onclick=()=>{let name=document.querySelector('#siteName').value.trim(),url=document.querySelector('#siteUrl').value.trim();if(!name||!url){alert('请填写名称和网址');return}if(!/^https?:\/\//i.test(url))url='https://'+url;try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;sites.push({name,url:u.href});persist();render();dlg.close()}catch(e){alert('网址无效')}};document.querySelector('#importBtn').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let doc=new DOMParser().parseFromString(await file.text(),'text/html'),links=[...doc.querySelectorAll('a[href]')].map(a=>({name:a.textContent.trim()||'书签',url:a.href})).filter(s=>s.name&&/^https?:$/.test(new URL(s.url).protocol)),seen=new Set(sites.map(s=>s.url)),added=0;for(let s of links)if(!seen.has(s.url)){sites.push(s);seen.add(s.url);added++}persist();render();alert('导入完成，新增 '+added+' 个书签。')}catch(err){alert('读取失败，请选择 Chrome 导出的书签 HTML 文件。')}e.target.value=''};render();
</script></body></html>
